[project]
name = "gym-agent"
version = "0.1.0"
description = "Voice coach for the gym app, built on LiveKit Agents and Claude"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "livekit-agents[anthropic,silero,turn-detector]~=1.8",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gym_agent"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: talks to a local Supabase (skipped when it isn't running)"]
