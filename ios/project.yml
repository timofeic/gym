name: Gym
options:
  bundleIdPrefix: com.timofeic
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
packages:
  GymCore:
    path: Packages/GymCore
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.6
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 10.1.0
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: 2.19.0
targets:
  Gym:
    type: application
    platform: iOS
    sources: [Gym]
    dependencies:
      - package: GymCore
      - package: Supabase
        product: PostgREST
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: LiveKit
        product: LiveKit
    info:
      path: Gym/Resources/Info.plist
      properties:
        CFBundleDisplayName: Gym
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: The voice coach listens so you can log workouts and ask questions hands-free.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        GymServiceURL: $(GYM_SERVICE_URL)
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        DevLoginEmail: $(DEV_LOGIN_EMAIL)
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        GIDServerClientID: $(GOOGLE_WEB_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timofeic.gym
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GymUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [GymUITests]
    dependencies:
      - target: Gym
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Gym:
    build:
      targets:
        Gym: all
        GymUITests: [test]
    test:
      targets: [GymUITests]
      gatherCoverageData: false
